[InputPlatformSettings_Windows InputPlatformSettings]
MaxPlatformUserCount=8
; CreateUniquePlatformUserForEachDevice. The engine default on Windows is 1
; (PrimaryUserSharesKeyboardAndFirstGamepad), which welds the first gamepad to player 1 and makes couch coop with a
; single gamepad impossible. UGeoGameViewportClient assigns each device to a player instead.
input.DeviceMappingPolicy=2
