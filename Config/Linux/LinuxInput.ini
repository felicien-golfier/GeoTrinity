[InputPlatformSettings_Linux InputPlatformSettings]
MaxPlatformUserCount=8
; CreateUniquePlatformUserForEachDevice, as in Config/Windows/WindowsInput.ini. The engine ships no Linux input ini,
; so without this section the policy falls back to PrimaryUserSharesKeyboardAndFirstGamepad, which welds the first
; gamepad to player 1 and makes couch coop with a single gamepad impossible.
input.DeviceMappingPolicy=2
